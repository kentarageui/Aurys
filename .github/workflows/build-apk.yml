name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: bun install

      - name: Prebuild Android
        run: bunx expo prebuild --platform android --clean
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_OPENSUBSONIC_API_VERSION: "1.16.1"
          EXPO_PUBLIC_CLIENT_NAME: "aurys"
          EXPO_PUBLIC_ENV: "preview"

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | grep -E "^e:|Caused by:|error:" | head -30 || true
        working-directory: apps/mobile/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"

      - name: Build APK with Gradle (full)
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aurys-release.apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
